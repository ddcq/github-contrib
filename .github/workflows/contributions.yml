name: contributions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BOT_BRANCH: bot/refresh-contributions
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate SVG
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIB_PAT || github.token }}
        run: PYTHONPATH=src python -m github_contrib --login ddcq --out contributions.svg
      - name: Commit SVG to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BOT_BRANCH"
          git add contributions.svg contributions-green.svg contributions-dark-green.svg contributions-blue.svg contributions-dark-blue.svg contributions-red.svg contributions-dark-red.svg
          git diff --cached --quiet || git commit -m "chore: refresh contributions.svg"
          git push -u origin "$BOT_BRANCH"
